name: CI

# 质量门禁：每次 PR 与推送到 main 都跑格式检查 + 静态分析 + 测试。
# 发版构建（打 tag 出 APK）在 flutter.yml，两者分离。
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # 输出实际格式差异，便于排查本地与 CI SDK 的 formatter 差异。
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format .
            git diff -- '*.dart'
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test release materials
        run: flutter test test/advanced_material_test.dart test/glass_lighting_test.dart test/glass_material_test.dart test/glass_reveal_pixels_test.dart test/navigation_lens_test.dart test/anchored_menu_test.dart test/material_stability_test.dart test/navigation_settings_test.dart test/design_consistency_test.dart test/home_density_test.dart --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true

      # Dart analyze/test 不会编译 android/ 下的 Kotlin。普通 PR/main CI 额外构建
      # github debug APK，提前拦截 MethodChannel、Manifest 和原生桥编译错误，避免
      # 只在打发布标签后才发现 Kotlin 无法编译。
      - name: Build Android debug APK
        run: flutter build apk --debug --flavor github --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true

  # 真实引擎集成测试：导航透镜 Shader 的加载与采样、玻璃菜单连续进出这类行为，
  # 只有在本机引擎上才验证得到，桌面 widget 测试替代不了。
  # 模拟器仍不等于真机——GPU 驱动差异与特定机型崩溃（见
  # docs/dev/android-glass-investigation.md）依旧只能人工真机验收。
  integration:
    name: Android integration tests
    runs-on: ubuntu-latest
    # 首次加入时设为非阻断：模拟器任务在本仓尚未跑通过之前，不应挡住正常 PR。
    # 连续几次全绿后请删掉这一行，让它成为真正的门禁。
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # GitHub 托管 runner 默认没有 /dev/kvm 权限，模拟器会退化成纯软件模拟并
      # 在启动阶段超时（实测 10 分钟仍未 boot）。这是 android-emulator-runner
      # 官方文档给出的放行方式。
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # 先把 APK 构建好再启动模拟器：Gradle 构建与模拟器同时跑会抢内存，
      # 实测模拟器会在构建期间被拖死（device offline）。构建产物带同样的参数，
      # 后面 flutter test 的 assemble 会直接复用。
      - name: Prebuild the debug APK
        run: flutter build apk --debug --flavor github --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true

      - name: Run integration tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # default 镜像比 google_apis 启动快，集成测试也不需要 Google 服务。
          target: default
          arch: x86_64
          profile: pixel_6
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -memory 2048
          disable-animations: true
          script: |
            flutter test integration_test/glass_navigation_test.dart integration_test/menu_animation_test.dart -d emulator-5554 --flavor github --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true
