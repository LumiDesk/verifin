name: CI

# 质量门禁：代码变更跑格式检查、静态分析、测试；推送到 main 时额外构建 debug APK。
# 仅文档变更（docs/README/AGENTS/CHANGELOG/.agents 等）只跑轻量变更检测，跳过重门禁，
# 避免文档提交陪跑 Flutter/Android 构建。含 lib/test/android/... 的提交仍完整跑。
# 发版构建（打 tag 出 APK/AAB）在 flutter.yml，两者分离。
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - 'lib/**'
              - 'test/**'
              - 'android/**'
              - 'assets/**'
              - 'integration_test/**'
              - 'scripts/**'
              - 'third_party/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - 'l10n.yaml'
              - '.github/workflows/**'

  verify:
    name: Format, Analyze, Test
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Docs-only change
        if: needs.changes.outputs.code != 'true'
        run: 'echo "Docs-only change: skipping format, analyze, tests and Android build."'

      - name: Setup Java
        if: needs.changes.outputs.code == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 依赖与任务缓存跨运行复用：首次仍要下载，之后 APK 构建能省掉一半以上。
      - uses: gradle/actions/setup-gradle@v6
        if: needs.changes.outputs.code == 'true'

      - name: Setup Flutter
        if: needs.changes.outputs.code == 'true'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        if: needs.changes.outputs.code == 'true'
        run: flutter pub get

      - name: Check formatting
        if: needs.changes.outputs.code == 'true'
        # 输出实际格式差异，便于排查本地与 CI SDK 的 formatter 差异。
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format .
            git diff -- '*.dart'
            exit 1
          fi

      - name: Analyze
        if: needs.changes.outputs.code == 'true'
        run: flutter analyze

      - name: Test
        if: needs.changes.outputs.code == 'true'
        run: flutter test

      - name: Test release materials
        if: needs.changes.outputs.code == 'true'
        # 发布外观专项：这些用例断言评审外观的几何与材质，普通 flutter test 也会跑到，
        # 单独列出来是为了在 CI 里明确它们是发版门禁。
        run: flutter test test/anchored_menu_test.dart test/material_stability_test.dart test/navigation_settings_test.dart test/design_consistency_test.dart test/home_density_test.dart

      # Dart analyze/test 不会编译 android/ 下的 Kotlin。main 的代码变更额外构建
      # github debug APK，提前拦截 MethodChannel、Manifest 和原生桥编译错误，避免
      # 只在打发布标签后才发现 Kotlin 无法编译。PR 与文档-only 变更不构建。
      - name: Build Android debug APK
        if: needs.changes.outputs.code == 'true' && github.event_name != 'pull_request'
        run: flutter build apk --debug --flavor github

# 集成测试（integration_test/）刻意不挂在 CI：它们需要真实引擎与真实帧时序，
# 只能跑在设备或模拟器上。曾试过 android-emulator-runner：
# 放行 /dev/kvm 后模拟器约 32 秒即可启动，但会在 Gradle 构建期间被系统杀掉
# （device offline / emulator not found）；换镜像、加内存、预构建 APK 三次调整均未通过，
# 故撤掉，避免长期红着的无效任务。需要时按 docs/dev/android-development.md 手动执行：
#   flutter test integration_test/ -d <device> --flavor diagnostic
