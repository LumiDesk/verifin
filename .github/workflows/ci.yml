name: CI

# 质量门禁：每次 PR 与推送到 main 都跑格式检查 + 静态分析 + 测试。
# 发版构建（打 tag 出 APK）在 flutter.yml，两者分离。
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # 独立的 Web UI Lab 只做视觉预览，不是 Veri Fin 的产品 Web 平台。
      - name: Install UI Lab dependencies
        working-directory: tool/ui_lab
        run: flutter pub get

      - name: Analyze UI Lab
        working-directory: tool/ui_lab
        run: flutter analyze

      - name: Test UI Lab
        working-directory: tool/ui_lab
        run: flutter test

      - name: Build UI Lab Web preview
        working-directory: tool/ui_lab
        run: flutter build web
