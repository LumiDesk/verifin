name: CI

# 质量门禁：每次 PR 与推送到 main 都跑格式检查 + 静态分析 + 测试。
# 发版构建（打 tag 出 APK）在 flutter.yml，两者分离。
on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Format, Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # 输出实际格式差异，便于排查本地与 CI SDK 的 formatter 差异。
        run: |
          if ! dart format --output=none --set-exit-if-changed .; then
            dart format .
            git diff -- '*.dart'
            exit 1
          fi

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test release materials
        run: flutter test test/advanced_material_test.dart test/glass_lighting_test.dart test/glass_material_test.dart test/glass_reveal_pixels_test.dart test/navigation_lens_test.dart test/anchored_menu_test.dart test/material_stability_test.dart test/navigation_settings_test.dart test/design_consistency_test.dart test/home_density_test.dart --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true

      # Dart analyze/test 不会编译 android/ 下的 Kotlin。普通 PR/main CI 额外构建
      # github debug APK，提前拦截 MethodChannel、Manifest 和原生桥编译错误，避免
      # 只在打发布标签后才发现 Kotlin 无法编译。
      - name: Build Android debug APK
        run: flutter build apk --debug --flavor github --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true

# 集成测试（integration_test/）刻意不挂在 CI：它们需要真实引擎（导航透镜 Shader、
# 玻璃菜单连续进出），只能跑在设备或模拟器上。曾试过 android-emulator-runner：
# 放行 /dev/kvm 后模拟器约 32 秒即可启动，但会在 Gradle 构建期间被系统杀掉
# （device offline / emulator not found）；换镜像、加内存、预构建 APK 三次调整均未通过，
# 故撤掉，避免长期红着的无效任务。需要时按 docs/dev/android-development.md 手动执行：
#   flutter test integration_test/ -d <device> --flavor diagnostic \
#     --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true
