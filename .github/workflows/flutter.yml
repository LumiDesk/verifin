name: Flutter CI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  checks:
    name: Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 固定到真机验收过的引擎版本；两渠道包含统一外观，高级材质仍默认关闭。
      - name: Verify release design flows
        run: flutter test test/design_consistency_test.dart test/unified_design_preview_test.dart test/advanced_material_test.dart test/glass_lighting_test.dart test/glass_reveal_pixels_test.dart test/home_density_test.dart test/navigation_lens_test.dart test/anchored_menu_test.dart test/material_stability_test.dart test/navigation_settings_test.dart --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true

      - name: Build release APK (github flavor)
        # GitHub 自分发包：github flavor，保留应用内一键自更新（REQUEST_INSTALL_PACKAGES）。
        # 只构建 arm64-v8a：2019 年后的安卓机几乎全是 arm64，一个包覆盖 99%+ 设备，
        # 相比 universal（打包 armeabi-v7a/arm64/x86_64 三套原生库）体积约减半。
        # 极老的 32 位机型装不了——已在 Release 说明中告知。
        run: flutter build apk --release --target-platform android-arm64 --flavor github --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true

      - name: Build release App Bundle (play flavor)
        # Google Play 上架用 AAB：play flavor 移除 REQUEST_INSTALL_PACKAGES（Play 政策禁止
        # 应用自更新），并 --dart-define=SELF_UPDATE=false 隐藏应用内自更新入口。
        # 与 APK 同用 verifinRelease 签名；AAB 含全部 ABI，由 Play 按设备分发。
        run: flutter build appbundle --release --flavor play --dart-define=SELF_UPDATE=false --dart-define=UNIFIED_DESIGN_PREVIEW=true --dart-define=GLASS_DESIGN_PREVIEW=true

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          short_sha="${GITHUB_SHA::7}"
          version_name="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-github-release.apk "release-artifacts/verifin-${version_name}-arm64-${short_sha}.apk"
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "release-artifacts/verifin-${version_name}-${short_sha}.aab"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: verifin-android-release
          path: release-artifacts/*

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: android
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: verifin-android-release
          path: release-artifacts

      - name: Check out repository
        uses: actions/checkout@v4

      # 发布说明从 CHANGELOG.md 对应版本段落生成，避免像此前那样把某一版的
      # 说明硬编码进工作流、之后每次发版都重复旧文案。
      - name: Compose release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          section="$(awk -v v="$version" 'index($0, "## [" v "]") == 1 { c = 1; next } c && index($0, "## [") == 1 { exit } c { print }' CHANGELOG.md)"
          if [ -z "$(printf '%s' "$section" | tr -d '[:space:]')" ]; then
            echo "::error::CHANGELOG.md 中找不到版本 $version 的条目"
            exit 1
          fi
          {
            echo "⚠️ 预发布（待验证）：此版本由 CI 自动构建，尚未经真机验收。"
            echo
            echo "📦 安装包为 **arm64-v8a** 架构，覆盖 2019 年后绝大多数安卓机型。极少数 32 位老设备可能无法安装。"
            echo
            printf '%s\n' "$section"
            echo
            echo "请下载 APK 直接覆盖安装，**不要卸载旧版本或清除应用数据**。换机或重装前请先在「数据管理」导出备份。"
            echo
            echo "应用内更新请开启「包含预发布版本（Beta）」以检测此版本；本次仍为预发布，不标记 Latest。"
          } > release-notes.md

      - name: Create pre-release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
          # 默认发预发布：不标记为 Latest，待真机测试通过后在 GitHub 手动改为正式版。
          prerelease: true
          make_latest: 'false'
          body_path: release-notes.md
