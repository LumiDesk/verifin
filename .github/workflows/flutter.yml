name: Flutter CI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  checks:
    name: Analyze, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # 发布说明是 Release 正文的唯一来源；缺文件在构建前就失败，不浪费一次 APK/AAB 构建。
      - name: Verify release notes
        run: |
          set -euo pipefail
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -s "$NOTES" ]; then
            echo "::error::缺少发布说明 $NOTES（模板见 docs/release-notes/_template.md）"
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        # 与 ci.yml 保持一致：打标签的发布提交同样必须通过格式门禁。
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Android APK + AAB
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.2'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 发布包与已评审外观同源，不再需要额外构建参数；先跑设计契约测试。
      - name: Verify design flows
        run: flutter test test/design_consistency_test.dart test/page_smoke_test.dart test/home_density_test.dart test/anchored_menu_test.dart test/material_stability_test.dart test/navigation_settings_test.dart

      - name: Build release APK (github flavor)
        # GitHub 自分发包：github flavor，保留应用内「检查更新」入口（只跳转 Release 页面）。
        # --target-platform 只控制 Flutter 自身的 ABI；--split-per-abi 才会同时剔除
        # 第三方 AAR（如 ML Kit）带入的 x86_64 / armeabi-v7a 原生库。
        # ABI split 默认会改写 versionCode；这里关闭该偏移，保持与 Play AAB 一致，
        # 避免 GitHub / Play 渠道切换时被系统判定为降级安装。
        # 极老的 32 位机型装不了；这条限制只记录在这里与 README，不再写进 Release 说明。
        env:
          JAVA_TOOL_OPTIONS: -Dorg.gradle.project.force-version-code-ignoring-abi=true
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi --flavor github

      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk
          test -f "$apk"
          if unzip -l "$apk" | grep -Eq ' lib/(x86_64|armeabi-v7a)/'; then
            echo "::error::Release APK contains non-arm64 native libraries"
            exit 1
          fi
          if ! unzip -l "$apk" | grep -q ' lib/arm64-v8a/libflutter.so'; then
            echo "::error::Release APK is missing arm64 Flutter native libraries"
            exit 1
          fi
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          aapt2="$(find "$sdk_root/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          test -n "$aapt2"
          actual_version_code="$("$aapt2" dump badging "$apk" | sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" | head -n 1)"
          expected_version_code="$(awk -F+ '/^version: /{gsub(/[[:space:]]/, "", $2); print $2}' pubspec.yaml)"
          if [ "$actual_version_code" != "$expected_version_code" ]; then
            echo "::error::Release APK versionCode $actual_version_code does not match pubspec build number $expected_version_code"
            exit 1
          fi

      - name: Build release App Bundle (play flavor)
        # Google Play 上架用 AAB：play flavor 隐藏应用内检查更新入口（Play 负责更新，
        # 也不允许引导用户到站外下载）。
        # 与 APK 同用 verifinRelease 签名；AAB 含全部 ABI，由 Play 按设备分发。
        run: flutter build appbundle --release --flavor play --dart-define=UPDATE_CHECK=false

      - name: Prepare release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          short_sha="${GITHUB_SHA::7}"
          version_name="${GITHUB_REF_NAME}"
          cp build/app/outputs/flutter-apk/app-arm64-v8a-github-release.apk "release-artifacts/verifin-${version_name}-arm64-${short_sha}.apk"
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "release-artifacts/verifin-${version_name}-${short_sha}.aab"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: verifin-android-release
          path: release-artifacts/*

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: android
    permissions:
      # 只有创建 Release 的 job 需要写权限；构建与校验 job 保持只读。
      contents: write
    steps:
      # 必须排在下载制品之前：actions/checkout 默认 clean=true，会删除工作区里
      # 未跟踪的文件。放在下载之后会把刚下下来的 APK/AAB 一起清掉，发布出一个
      # 没有附件的空版本（v1.16.16 就是这样发的）。
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          name: verifin-android-release
          path: release-artifacts

      # 发布说明直接取自 docs/release-notes/vX.Y.Z.md，与其它项目保持一致：
      # 文件即正文，预发布提示与安装说明写在模板里，不再由工作流拼接。
      - name: Create pre-release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
          # 附件匹配不到就整步失败，避免再发出一个没有安装包的「空」版本。
          fail_on_unmatched_files: true
          # 默认发预发布：不标记为 Latest，待真机测试通过后在 GitHub 手动改为正式版。
          prerelease: true
          make_latest: 'false'
          body_path: docs/release-notes/${{ github.ref_name }}.md
